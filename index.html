<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital System</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b3a63">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;--b:#0b5cad;--g:#0a7d4b;--ln:#d8dde2}*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:#eef2f6;color:#14181c}
header{background:#0b3a63;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
header select{width:auto;padding:4px 8px}nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--ln);padding:6px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{width:auto;margin:0;background:#e8eef4;color:#14181c;padding:8px 14px;white-space:nowrap}nav button.on{background:var(--b);color:#fff}
main{max-width:1050px;margin:0 auto;padding:12px}.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:16px}h3{margin:12px 0 4px;font-size:14px}label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
input,select,textarea,button{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid #b8c0c8;background:#fff;color:#14181c}textarea{min-height:60px}
button{background:#14181c;color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:8px}button.g{background:var(--g)}button.b{background:var(--b)}button.r{background:#b3261e}button.s{width:auto;padding:4px 10px;margin:0}button.alt{background:#e8eef4;color:#14181c}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.row>button{margin-top:0;align-self:end}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{font-size:12px;color:#555}
.big{font-size:24px;font-weight:800}.mut{color:#666;font-size:12px}.tag{padding:1px 8px;border-radius:99px;font-size:11px;background:#e8eef4;white-space:nowrap}.bad{background:#fde3e0;color:#7a1b13}.warn{background:#fff3d6;color:#5a4300}.ok{background:#dff3e6;color:#12532d}.inf{background:#dbe9f8;color:#0b3a63}
.tw{overflow-x:auto}.hide{display:none}.msg{padding:9px;border-radius:8px;margin-top:8px;background:#fff3d6;color:#5a4300}.msg.bad{background:#fde3e0;color:#7a1b13}.msg.good{background:#dff3e6;color:#12532d}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}.bed{padding:8px;border-radius:8px;border:1px solid var(--ln);text-align:center;font-size:12px}.bed.free{background:#dff3e6}.bed.occ{background:#fde3e0}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--ln)}.chk input{width:20px;height:20px;flex:none;padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;overflow:auto;color:#fff}.modal.hide{display:none}.modal img{max-width:100%;max-height:78vh;border-radius:8px;background:#000}
#print{display:none}.rc{font:12px/1.4 monospace;color:#000;padding:6mm;width:180mm}.rc hr{border:0;border-top:1px dashed #000}.rc .rt{display:flex;justify-content:space-between}.rc table td,.rc table th{border:0;padding:2px 4px;color:#000}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}@page{margin:0}}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="34" height="34" style="border-radius:8px"><div><b id="hn">Hospital System</b><div class="mut" id="hu" style="color:#bcd6ee"></div></div></div><div style="display:flex;gap:8px;align-items:center"><span id="net" class="tag ok">Online</span><select id="brs" class="hide"></select><button id="lo" class="s alt hide">Log out</button></div></header>
<nav id="nav" class="hide"></nav>
<main><section id="auth" class="card" style="max-width:420px;margin:30px auto"><h2 id="at">Log in</h2>
 <div id="regf" class="hide"><label>Full name</label><input id="rn"></div><label>Username</label><input id="un" autocapitalize="none"><label>Password</label><input id="pw" type="password">
 <button id="go" class="b">Log in</button><button id="sw" class="alt">Create an account</button><div id="am"></div></section><div id="v"></div></main><div id="imv" class="modal hide"><div id="imb" style="width:100%;max-width:900px;text-align:center"></div><button id="imc" style="max-width:300px">Close</button></div><div id="print"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCB22O2zxLdyLrrmRQ2Rjo5ASQdxVmWjW4",authDomain:"hospital-60e87.firebaseapp.com",projectId:"hospital-60e87",storageBucket:"hospital-60e87.firebasestorage.app",messagingSenderId:"193886616146",appId:"1:193886616146:web:1e63c9a029ed92a68f3d8b"});
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp,INC=firebase.firestore.FieldValue.increment;
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=n=>db.collection(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),m2=x=>Math.round(x*100)/100,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const say=(el,t,c)=>{$(el).innerHTML=t?`<div class="msg ${c||''}">${t}</div>`:''};
const ROLES={admin:'Administrator',doctor:'Doctor',nurse:'Nurse',reception:'Reception',lab:'Lab and radiology',pharmacist:'Pharmacist',cashier:'Billing and cashier',hr:'HR and payroll',pending:'Waiting for a role'};
const TABS={admin:['dash','pat','queue','theatre','lab','pharm','ward','bill','claims','refer','roster','payroll','setup'],doctor:['queue','pat','ward','theatre','refer','roster'],nurse:['queue','pat','ward','theatre','roster'],reception:['pat','queue','refer','roster'],lab:['lab','roster'],pharmacist:['pharm','roster'],cashier:['bill','claims','roster'],hr:['roster','payroll'],pending:[]};
const TN={dash:'Dashboard',pat:'Patients',queue:'Queue and visits',theatre:'Theatre',lab:'Lab and radiology',pharm:'Pharmacy',ward:'Wards',bill:'Billing',claims:'Insurance claims',refer:'Referrals',roster:'Rosters',payroll:'Payroll',setup:'Setup'};
let U=null,CFG={name:'Hospital',addr:'',tel:'',cur:'GHS'},BRS=[],br=null,SERV=[],DRUGS=[],STK={},WARDS=[],BEDS=[],DOCS=[],unsubs=[],scr=[],tab='',stU=null;
const money=x=>CFG.cur+' '+Number(x||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const fdt=t=>{const d=t&&t.toDate?t.toDate():new Date(t||Date.now());return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})};
const brn=id=>(BRS.find(b=>b.id===id)||{}).name||'',brc=id=>(BRS.find(b=>b.id===id)||{}).code||'HQ',is=(...r)=>U&&r.includes(U.role);
const why=e=>e&&e.code==='permission-denied'?'Your role is not allowed to do that.':'Error: '+((e&&(e.code||e.message))||'unknown');
addEventListener('online',net);addEventListener('offline',net);function net(){$('net').textContent=navigator.onLine?'Online':'Offline: saving on this device';$('net').className='tag '+(navigator.onLine?'ok':'warn')}
const V=h=>{$('v').innerHTML=h},err=t=>{if($('err'))$('err').textContent=t||''},printIt=h=>{$('print').innerHTML=h;setTimeout(()=>window.print(),50)};
let devId=localStorage.getItem('hms_dev');if(!devId){devId=Math.random().toString(36).slice(2,4).toUpperCase();localStorage.setItem('hms_dev',devId)}
const nextNo=p=>{const n=+(localStorage.getItem('hms_ctr')||0)+1;localStorage.setItem('hms_ctr',n);return brc(br)+'-'+devId+'-'+p+String(n).padStart(5,'0')};
const sub=(q,f)=>scr.push(q.onSnapshot(f,e=>console.log(e.code))),rows=sn=>sn.docs.map(d=>({id:d.id,...d.data()}));
const audit=(a,p)=>COL('audit').add({uid:U.uid,name:U.name,action:a,pid:p||'',branch:br,at:TS()}).catch(()=>{});
const ago=t=>t&&t.toDate?t.toDate():new Date(t||Date.now());

/* ---------- accounts ---------- */
const mail=async u=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.trim().toLowerCase()));return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('')+'@hms.local'};
let reg=false;
$('sw').onclick=()=>{reg=!reg;$('regf').classList.toggle('hide',!reg);$('at').textContent=reg?'Create account':'Log in';$('go').textContent=reg?'Create account':'Log in';$('sw').textContent=reg?'I have an account':'Create an account';say('am','')};
$('go').onclick=async()=>{const u=$('un').value,p=$('pw').value;if(!u.trim()||!p)return say('am','Enter a username and a password.','bad');
 try{const em=await mail(u),pp=p+'#hms-2026';
  if(reg){if(!$('rn').value.trim())return say('am','Enter your full name.','bad');const c=await auth.createUserWithEmailAndPassword(em,pp);
   await COL('users').doc(c.user.uid).set({name:$('rn').value.trim(),username:u.trim().toLowerCase(),role:'pending',branch:null,active:true,created:TS()})}
  else await auth.signInWithEmailAndPassword(em,pp)}
 catch(e){say('am',e.code==='auth/email-already-in-use'?'That username is taken.':'Could not continue. Check your details.','bad')}};
$('lo').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
 stop();if(!u){U=null;$('auth').classList.remove('hide');$('v').innerHTML='';$('nav').classList.add('hide');$('lo').classList.add('hide');$('brs').classList.add('hide');$('hu').textContent='';return}
 let s;for(let i=0;i<8;i++){s=await COL('users').doc(u.uid).get();if(s.exists)break;await sleep(500)}
 if(!s.exists){await auth.signOut();return say('am','Profile not found. Create the account again.','bad')}
 U={uid:u.uid,...s.data()};$('auth').classList.add('hide');$('lo').classList.remove('hide');net();begin()});
function stop(){unsubs.forEach(f=>f());unsubs=[];scr.forEach(f=>f());scr=[];if(stU){stU();stU=null}}
function begin(){
 if(!U.active||U.role==='pending'){$('hu').textContent=U.name;V(`<div class="card"><h2>${U.active?'Waiting for a role':'Account disabled'}</h2><p>${U.active?'An administrator must give your account a role and a branch. Close and reopen the app after that.':'Ask an administrator.'}</p></div>`);return}
 const L=(q,f)=>unsubs.push(q.onSnapshot(f,e=>console.log(e.code)));
 L(COL('config').doc('main'),s=>{if(s.exists)CFG={...CFG,...s.data()};$('hn').textContent=CFG.name});
 L(COL('branches'),sn=>{BRS=rows(sn);if(!br||!BRS.find(b=>b.id===br))br=(BRS.find(b=>b.id===U.branch)||BRS[0]||{}).id||null;brSel();listen()});
 L(COL('services'),sn=>{SERV=rows(sn).sort((a,b)=>a.name.localeCompare(b.name))});L(COL('drugs'),sn=>{DRUGS=rows(sn).sort((a,b)=>a.name.localeCompare(b.name))});L(COL('insurers'),sn=>{INS=rows(sn)});
 L(COL('users').where('role','==','doctor'),sn=>{DOCS=rows(sn).filter(d=>d.active!==false)});
 $('nav').classList.remove('hide');tab=TABS[U.role][0];nav();go(tab)}
function brSel(){const b=$('brs');b.classList.toggle('hide',!(is('admin','hr')&&BRS.length));b.innerHTML=BRS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(br)b.value=br;$('hu').textContent=U.name+' · '+ROLES[U.role]+(br?' · '+brn(br):'')}
$('brs').onchange=()=>{br=$('brs').value;listen();brSel();go(tab)};
function listen(){if(stU){stU();stU=null}STK={};WARDS=[];BEDS=[];if(!br)return;
 const a=COL('stock').where('branch','==',br).onSnapshot(sn=>{STK={};sn.docs.forEach(d=>{STK[d.id]=d.data()});if(tab==='pharm')vPharm()},e=>console.log(e.code)),
 b=COL('wards').where('branch','==',br).onSnapshot(sn=>{WARDS=rows(sn)},e=>console.log(e.code)),
 c=COL('beds').where('branch','==',br).onSnapshot(sn=>{BEDS=rows(sn).sort((x,y)=>(x.no||'').localeCompare(y.no||'',undefined,{numeric:true}));if(tab==='ward')vWard()},e=>console.log(e.code));
 stU=()=>{a();b();c()}}
function nav(){$('nav').innerHTML=TABS[U.role].map(t=>`<button data-t="${t}" class="${t===tab?'on':''}">${TN[t]}</button>`).join('')}
function go(t,keep){scr.forEach(f=>f());scr=[];tab=t;if(!keep)st={};nav();({dash:vDash,pat:vPat,queue:vQueue,theatre:vTheatre,lab:vLab,pharm:vPharm,ward:vWard,bill:vBill,claims:vClaims,refer:vRefer,roster:vRoster,payroll:vPayroll,setup:vSetup})[t]()}
let st={};
const patLine=p=>`<b>${esc(p.name)}</b> <span class="mut">${esc(p.no)}</span>${p.insurer?' <span class="tag inf">'+esc(insName(p.insurer))+'</span>':''}`;
const age=p=>p.dob?Math.max(0,Math.floor((Date.now()-new Date(p.dob))/315576e5))+' yrs':(p.age?p.age+' yrs':'');

/* ---------- patients ---------- */
function vPat(){V(`<div class="card"><h2>Find a patient</h2><div class="row"><div><input id="ps" placeholder="Name, patient number or phone"></div><button class="b" data-a="psearch">Search</button>${is('admin','reception','nurse')?'<button class="g" data-a="pnew">Register a new patient</button>':''}</div><div id="pform"></div></div><div class="card"><div id="pl" class="tw"></div></div>`);$('ps').onkeydown=e=>{if(e.key==='Enter')A.psearch()};A.psearch()}
async function psearch(){const q=($('ps').value||'').trim(),ql=q.toLowerCase();$('pl').innerHTML='Searching…';
 try{let docs=[];if(q.length<2)docs=(await COL('patients').orderBy('at','desc').limit(20).get()).docs;else{const E=String.fromCharCode(0xf8ff),r=await Promise.all([COL('patients').where('no','==',q.toUpperCase()).get(),COL('patients').where('phone','==',q).get(),COL('patients').where('nameLower','>=',ql).where('nameLower','<=',ql+E).limit(20).get()]);const m={};r.forEach(s=>s.docs.forEach(d=>{m[d.id]=d}));docs=Object.values(m)}
  const P=docs.map(d=>({id:d.id,...d.data()}));$('pl').innerHTML='<table><tr><th>Patient</th><th>Details</th><th></th></tr>'+(P.map(p=>`<tr><td>${patLine(p)}</td><td>${esc(p.sex||'')} ${age(p)}<br><span class="mut">${esc(p.phone||'')}</span></td><td><button class="s b" data-a="pfile" data-id="${p.id}">Open</button></td></tr>`).join('')||'<tr><td colspan=3 class="mut">No patients found.</td></tr>')+'</table>'}
 catch(e){$('pl').innerHTML='<div class="msg bad">'+esc(why(e))+'</div>'}}
function pnewForm(){$('pform').innerHTML=`<h3>New patient</h3><div class="row"><div><label>Full name</label><input id="n1"></div><div><label>Sex</label><select id="n2"><option>Female</option><option>Male</option></select></div><div><label>Date of birth</label><input id="n3" type="date"></div><div><label>Or age (years)</label><input id="n4" type="number"></div><div><label>Phone</label><input id="n5" inputmode="tel"></div><div><label>Insurance</label><select id="n6i"><option value="">None (pays cash)</option>${insList().map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></div><div><label>Policy or member number</label><input id="n6"></div><div><label>Address</label><input id="n7"></div><div><label>Next of kin</label><input id="n8"></div><div><label>Kin phone</label><input id="n9"></div><div><label>Allergies</label><input id="n10"></div></div><div id="err" style="color:#b3261e"></div><button class="g" data-a="psave">Register patient</button>`}
async function psave(){const n=$('n1').value.trim();if(!n)return err('Enter the patient name.');const g=k=>$(k).value.trim(),id=uid(),p={no:nextNo('P'),name:n,nameLower:n.toLowerCase(),sex:$('n2').value,dob:$('n3').value,age:+$('n4').value||0,phone:g('n5'),insurer:$('n6i').value,policy:g('n6'),addr:g('n7'),kin:g('n8'),kinPhone:g('n9'),allergies:g('n10'),branch:br,createdBy:U.uid};
 try{await Promise.race([COL('patients').doc(id).set({...p,at:TS()}),sleep(4000)]);audit('register',id);vFile(id)}catch(e){err(why(e))}}
async function vFile(id){go('pat');tab='pat';V('<div class="card">Loading…</div>');audit('view',id);
 try{const [ps,vs,as,os,bs]=await Promise.all([COL('patients').doc(id).get(),COL('visits').where('pid','==',id).get(),COL('admissions').where('pid','==',id).get(),COL('orders').where('pid','==',id).get(),is('admin','cashier')?COL('bills').where('pid','==',id).get():Promise.resolve({docs:[]})]);
  const p={id,...ps.data()},VS=rows(vs).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),AD=rows(as),BL=rows(bs),OR=rows(os).filter(o=>o.type!=='rx'&&o.status==='done').sort((a,b)=>(b.doneAt?.seconds||0)-(a.doneAt?.seconds||0));st.p=p;
  V(`<div class="card"><button class="s alt" data-a="pback">Back</button><h2 style="margin-top:8px">${patLine(p)}</h2><p>${esc(p.sex||'')} · ${age(p)} · ${esc(p.phone||'-')} · ${esc(p.addr||'')}<br>Insurance: ${p.insurer?esc(insName(p.insurer))+' · '+esc(p.policy||''):'none'} · Next of kin: ${esc(p.kin||'-')} ${esc(p.kinPhone||'')}</p>${p.allergies?`<div class="msg bad">Allergies: ${esc(p.allergies)}</div>`:''}
  ${is('admin','reception','doctor','nurse')?'<h3>New visit or appointment</h3><div class="row"><div><label>Doctor</label><select id="vd"><option value="">Any available doctor</option>'+DOCS.filter(d=>!d.branch||d.branch===br).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')+'</select></div><div><label>Reason</label><input id="vr"></div><div><label>Appointment date (leave blank for today)</label><input id="vw" type="date"></div><button class="g" data-a="vnew">Create visit</button></div><div id="vm"></div>':''}</div>
  <div class="card"><h2>Visits</h2><div class="tw"><table><tr><th>Date</th><th>Doctor / reason</th><th>Diagnosis</th><th>Status</th></tr>${VS.map(v=>`<tr><td>${v.date}</td><td>${esc(v.doctorName||'-')}<br><span class="mut">${esc(v.reason||'')}</span></td><td>${esc(v.diagnosis||'')}<br><span class="mut">${esc(v.notes||'')}</span></td><td><span class="tag">${v.status}</span></td></tr>`).join('')||'<tr><td colspan=4 class="mut">No visits yet.</td></tr>'}</table></div></div>
  <div class="card"><h2>Lab and radiology results</h2><table>${OR.map(o=>`<tr><td>${fdt(o.doneAt)}<br><span class="mut">${o.type}</span></td><td>${o.items.map(i=>esc(i.name)).join(', ')}<br><span class="mut">${esc(o.result||'')}</span></td><td><button class="s" data-a="limg" data-id="${o.id}">Images</button></td></tr>`).join('')||'<tr><td class="mut">No results yet.</td></tr>'}</table></div>
  <div class="card"><h2>Admissions</h2><table>${AD.map(a=>`<tr><td>${fdt(a.at)}</td><td>${esc(a.wardName)} bed ${esc(a.bedNo)}</td><td><span class="tag ${a.status==='admitted'?'warn':'ok'}">${a.status}</span></td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>
  ${is('admin','cashier')?`<div class="card"><h2>Bills</h2><table>${BL.map(b=>`<tr><td>${esc(b.title||'')}<br><span class="mut">${fdt(b.at)}</span></td><td>${money(b.total)}</td><td>${money(b.paid)}</td><td><span class="tag">${b.status}</span></td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>`:''}`)}
 catch(e){V('<div class="card msg bad">'+esc(why(e))+'</div>')}}
async function vnew(){const p=st.p,dsel=$('vd').value,d=DOCS.find(x=>x.id===dsel),w=$('vw').value,date=w||today();
 try{await COL('visits').add({pid:p.id,pname:p.name,pno:p.no,branch:br,doctorId:dsel,doctorName:d?d.name:'',reason:$('vr').value.trim(),date,status:w&&w>today()?'booked':'waiting',at:TS()});say('vm','Visit created. It appears in the queue for '+date+'.','good')}catch(e){say('vm',why(e),'bad')}}

/* ---------- queue, triage, consultation ---------- */
const VST={booked:'inf',waiting:'warn',triaged:'warn',done:'ok',cancelled:'bad'};
function vQueue(){const d=st.qd||today();V(`<div id="work"></div><div class="card"><div class="row"><div><label>Date</label><input id="qd" type="date" value="${d}"></div></div><div class="tw"><table id="qt"></table></div></div>`);
 $('qd').onchange=()=>{st.qd=$('qd').value;go('queue',true)};

 sub(COL('referrals').where('branch','==',br),sn=>{st.rf=rows(sn).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0));$('rls').innerHTML='<table><tr><th>Patient</th><th>Facility</th><th>Reason</th><th>Status</th><th></th></tr>'+(st.rf.map(r=>`<tr><td>${esc(r.pname)}<br><span class="mut">${esc(r.pno)} · ${fdt(r.at)}</span></td><td>${r.direction==='out'?'To':'From'} ${esc(r.facility)}<br><span class="mut">${esc(r.specialty||'')} · ${esc(r.urgency)}</span></td><td>${esc(r.reason)}</td><td>${is('admin','doctor','reception')?`<select data-a2="rst" data-id="${r.id}">${['sent','accepted','completed','declined'].map(x=>`<option${r.status===x?' selected':''}>${x}</option>`).join('')}</select>`:r.status}</td><td><button class="s" data-a="rprint" data-id="${r.id}">Print letter</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">No referrals yet.</td></tr>')+'</table>'})}
async function rfill(){const p=st.pk;if(!p)return err('Choose a patient first.');const v=rows(await COL('visits').where('pid','==',p.id).get()).filter(x=>x.status==='done').sort((a,b)=>b.date.localeCompare(a.date))[0];if(!v)return err('This patient has no completed visit yet.');err('');$('rsu').value='Last visit '+v.date+'. Diagnosis: '+(v.diagnosis||'-')+'. '+(v.notes||'')+(p.allergies?' Allergies: '+p.allergies+'.':'')}
async function rsave(){const p=st.pk;if(!p)return err('Choose a patient first.');if(!$('rfa').value.trim()||!$('rre').value.trim())return err('Enter the facility and the reason.');
 try{await COL('referrals').add({pid:p.id,pname:p.name,pno:p.no,branch:br,direction:$('rdr').value,facility:$('rfa').value.trim(),specialty:$('rsp').value.trim(),urgency:$('rug').value,reason:$('rre').value.trim(),summary:$('rsu').value.trim(),doctorName:U.name,status:'sent',at:TS()});audit('referral',p.id);go('refer')}catch(e){err(why(e))}}

/* ---------- ward rounds with orders ---------- */
const svItems=(ids,type)=>ids.map(i=>SERV.find(x=>x.id===i)).filter(x=>x&&x.type===type).map(x=>({sid:x.id,name:x.name,price:x.price,nhis:!!x.nhis,qty:1}));
function roundForm(a){st.rx=[];st.ra=a;const lab=SERV.filter(x=>['lab','rad'].includes(x.type));
 $('wn').innerHTML=`<div class="card"><h2>Ward round: ${esc(a.pname)}</h2><label>Round note</label><textarea id="c1"></textarea><h3>Lab and radiology</h3><div class="tw" style="max-height:160px;overflow:auto">${lab.map(x=>`<label class="chk"><input type="checkbox" data-sid="${x.id}"> ${esc(x.name)} <span class="mut">${x.type} · ${money(x.price)}</span></label>`).join('')||'<span class="mut">No tests in the catalogue.</span>'}</div>
 <h3>Prescription</h3><div class="row"><div><select id="rd">${DRUGS.map(d=>`<option value="${d.id}">${esc(d.name)} (${money(d.price)})</option>`).join('')}</select></div><div><input id="rdose" placeholder="Dose and duration"></div><div><input id="rq" type="number" value="10"></div><button class="alt" data-a="rxadd">Add drug</button></div><div id="rxl"></div>
 <div id="err" style="color:#b3261e"></div><button class="g" data-a="rsave2">Save round and orders</button> <button class="alt" data-a="wclose2">Close</button></div>`;scrollTo(0,0)}
async function rsave2(){const a=st.ra,b=db.batch(),ids=[...document.querySelectorAll('[data-sid]')].filter(x=>x.checked).map(x=>x.dataset.sid);
 const mk=(type,items)=>{if(items.length)b.set(COL('orders').doc(uid()),{admId:a.id,visitId:'',pid:a.pid,pname:a.pname,pno:a.pno,branch:br,type,items,status:'requested',by:U.name,doctorId:U.uid,at:TS()})};
 mk('lab',svItems(ids,'lab'));mk('rad',svItems(ids,'rad'));mk('rx',st.rx);const t=$('c1').value.trim();if(t)b.update(COL('admissions').doc(a.id),{notes:[...(a.notes||[]),{at:Date.now(),by:U.name,text:'Round: '+t}]});
 try{await Promise.race([b.commit(),sleep(4000)]);$('wn').innerHTML='';audit('round',a.pid)}catch(e){err(why(e))}}

/* ---------- rosters ---------- */
async function vRoster(){const d0=st.rd||today(),d1=new Date(new Date(d0).getTime()+6*864e5).toISOString().slice(0,10),ed=is('admin','hr');
 if(ed&&!ULIST.length){try{ULIST=rows(await COL('users').get())}catch(e){}}
 V(`${ed?`<div class="card"><h2>Add a shift</h2><div class="row"><div><label>Staff</label><select id="ru">${ULIST.filter(u=>u.active!==false&&u.role!=='pending'&&(!br||u.branch===br)).map(u=>`<option value="${u.id}">${esc(u.name)} (${ROLES[u.role]})</option>`).join('')}</select></div><div><label>Date</label><input id="rdt" type="date" value="${d0}"></div><div><label>Shift</label><select id="rsh"><option>Morning 07:00-15:00</option><option>Afternoon 15:00-22:00</option><option>Night 22:00-07:00</option><option>Off</option></select></div><div><label>Note</label><input id="rno"></div><button class="g" data-a="radd2">Add shift</button></div><div id="err" style="color:#b3261e"></div></div>`:''}<div class="card"><div class="row"><div><label>Week starting</label><input id="rwk" type="date" value="${d0}"></div></div><div class="tw" id="rtb"></div></div>`);
 $('rwk').onchange=()=>{st.rd=$('rwk').value;go('roster',true)};
 sub(COL('rosters').where('date','>=',d0).where('date','<=',d1),sn=>{const R=rows(sn).filter(r=>!br||r.branch===br).sort((a,b)=>(a.date+a.shift).localeCompare(b.date+b.shift));
  $('rtb').innerHTML='<table><tr><th>Date</th><th>Shift</th><th>Staff</th><th></th></tr>'+(R.map(r=>`<tr><td>${r.date}</td><td>${esc(r.shift)}</td><td>${esc(r.name)} <span class="mut">${ROLES[r.role]||''}</span>${r.uid===U.uid?' <span class="tag inf">you</span>':''}<br><span class="mut">${esc(r.note||'')}</span></td><td>${ed?`<button class="s r" data-a="rdel" data-id="${r.id}">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">No shifts this week.</td></tr>')+'</table>'})}
async function radd2(){const u=ULIST.find(x=>x.id===$('ru').value);if(!u||!$('rdt').value)return err('Choose a staff member and a date.');try{await COL('rosters').add({uid:u.id,name:u.name,role:u.role,branch:br,date:$('rdt').value,shift:$('rsh').value,note:$('rno').value.trim(),at:TS()});err('')}catch(e){err(why(e))}}

/* ---------- payroll ---------- */
const BANDS0=['490:0','110:5','130:10','3166.67:17.5','16000:25','30520:30','inf:35'].join(NL);
const PAYC=()=>{const c=CFG.pay||{};return {ssnit:c.ssnit??5.5,ssnitEr:c.ssnitEr??13,bands:c.bands||BANDS0}};
const bandsOf=t=>t.split(NL).map(l=>l.trim()).filter(Boolean).map(l=>{const a=l.split(':');return [a[0].trim().toLowerCase()==='inf'?Infinity:+a[0],+a[1]]});
const paye=t=>{let r=0,left=t;for(const b of bandsOf(PAYC().bands)){const x=Math.min(left,b[0]);if(x<=0)break;r+=x*b[1]/100;left-=x}return m2(r)};
const calcPay=p=>{const c=PAYC(),bs=+p.basic||0,g=m2(bs+(+p.allow||0)),sn=m2(bs*c.ssnit/100),tx=m2(g-sn),x=paye(tx),d=+p.ded||0;return {gross:g,ssnit:sn,taxable:tx,paye:x,ded:d,net:m2(g-sn-x-d),er:m2(bs*c.ssnitEr/100)}};
async function vPayroll(){V('<div class="card">Loading…</div>');
 try{ULIST=rows(await COL('users').get());st.sp={};rows(await COL('staffpay').get()).forEach(x=>{st.sp[x.id]=x});const c=PAYC(),mo=st.pm||today().slice(0,7),L=ULIST.filter(u=>u.active!==false&&u.role!=='pending'&&u.branch===br);
  V(`<div class="msg">Tax and pension rates are editable defaults. Check them with GRA, SSNIT or your accountant before paying anyone.</div>
  <div class="card"><h2>Rates</h2><div class="row"><div><label>SSNIT employee %</label><input id="py1" type="number" step="0.1" value="${c.ssnit}"></div><div><label>SSNIT employer % (information)</label><input id="py2" type="number" step="0.1" value="${c.ssnitEr}"></div></div><label>Monthly tax bands: amount:percent on each line, last line inf</label><textarea id="py3" style="min-height:120px">${esc(c.bands)}</textarea><button class="g" data-a="paysave">Save rates</button><div id="pym"></div></div>
  <div class="card"><h2>Staff pay (${esc(brn(br))})</h2><div class="tw"><table><tr><th>Staff</th><th>Basic</th><th>Allowances</th><th>Other deductions</th><th></th></tr>${L.map(u=>{const x=st.sp[u.id]||{};return `<tr><td>${esc(u.name)}<br><span class="mut">${ROLES[u.role]}</span></td><td><input id="pb_${u.id}" type="number" step="0.01" value="${x.basic||''}" style="width:110px"></td><td><input id="pa_${u.id}" type="number" step="0.01" value="${x.allow||''}" style="width:110px"></td><td><input id="pd_${u.id}" type="number" step="0.01" value="${x.ded||''}" style="width:110px"></td><td><button class="s g" data-a="spsave" data-id="${u.id}">Save</button></td></tr>`}).join('')||'<tr><td colspan=5 class="mut">No staff are assigned to this branch.</td></tr>'}</table></div></div>
  <div class="card"><h2>Run payroll</h2><div class="row"><div><label>Month</label><input id="pmo" type="month" value="${mo}"></div><button class="b" data-a="prun">Calculate</button></div><div id="prr"></div></div><div class="card"><h2>Saved payroll runs</h2><div id="pru" class="tw"></div></div>`);
  prList()}catch(e){V('<div class="card msg bad">'+esc(why(e))+'</div>')}}
async function prList(){try{st.runs=rows(await COL('payruns').where('branch','==',br).get()).sort((a,b)=>b.month.localeCompare(a.month));$('pru').innerHTML='<table>'+st.runs.map(r=>`<tr><td>${r.month}</td><td>${r.lines.length} staff</td><td>Net ${money(r.totals.net)}</td><td><button class="s" data-a="prprint" data-id="${r.id}">Payslips</button></td></tr>`).join('')+'</table>'}catch(e){}}
const slipHtml=(r,l)=>`<div class="rc" style="page-break-after:always"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>${esc(brn(r.branch))}<br>PAYSLIP ${r.month}</div><hr>${esc(l.name)} · ${ROLES[l.role]||''}<hr>${[['Basic salary',l.basic],['Allowances',l.allow],['Gross pay',l.gross],['SSNIT (employee)','-'+l.ssnit],['Taxable pay',l.taxable],['PAYE tax','-'+l.paye],['Other deductions','-'+l.ded]].map(x=>`<div class="rt"><span>${x[0]}</span><span>${Number(x[1]).toFixed(2)}</span></div>`).join('')}<hr><div class="rt"><b>NET PAY</b><b>${money(l.net)}</b></div></div>`;
async function prun(){const mo=$('pmo').value;if(!mo)return;const L=ULIST.filter(u=>u.active!==false&&u.role!=='pending'&&u.branch===br),lines=[];
 L.forEach(u=>{const x=st.sp[u.id];if(x&&+x.basic>0)lines.push({uid:u.id,name:u.name,role:u.role,basic:+x.basic,allow:+x.allow||0,...calcPay(x)})});
 const T=k=>m2(sum(lines,l=>l[k]));st.run={id:mo+'_'+br,month:mo,branch:br,lines,totals:{gross:T('gross'),ssnit:T('ssnit'),paye:T('paye'),net:T('net'),er:T('er')}};
 $('prr').innerHTML=`<div class="tw"><table><tr><th>Staff</th><th>Gross</th><th>SSNIT</th><th>PAYE</th><th>Other</th><th>Net</th></tr>${lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.gross.toFixed(2)}</td><td>${l.ssnit.toFixed(2)}</td><td>${l.paye.toFixed(2)}</td><td>${l.ded.toFixed(2)}</td><td><b>${l.net.toFixed(2)}</b></td></tr>`).join('')||'<tr><td colspan=6 class="mut">Enter basic pay for your staff first.</td></tr>'}<tr><th>Total</th><th>${st.run.totals.gross.toFixed(2)}</th><th>${st.run.totals.ssnit.toFixed(2)}</th><th>${st.run.totals.paye.toFixed(2)}</th><th></th><th>${st.run.totals.net.toFixed(2)}</th></tr></table></div><p class="mut">Employer SSNIT contribution on top: ${money(st.run.totals.er)}</p>${lines.length?'<button class="g" data-a="prsave">Save this payroll run</button> <button class="alt" data-a="prprintnow">Print payslips</button>':''}<div id="prm"></div>`}

/* ---------- more actions ---------- */
const A2={tchk:async t=>{const c=st.tc.find(x=>x.id===t.dataset.id);try{await COL('theatre').doc(c.id).update({chk:{...(c.chk||{}),[t.dataset.k]:t.checked}})}catch(e){alert(why(e));t.checked=!t.checked}},
 rst:t=>COL('referrals').doc(t.dataset.id).update({status:t.value}).catch(e=>alert(why(e)))};
Object.assign(A,{
 ppsearch:ppsearch,ppick:d=>ppick(d.id),tbook:tbook,
 tstart:async d=>{const c=st.tc.find(x=>x.id===d.id);if(!(c.chk||{}).consent)return alert('Consent must be ticked before surgery starts.');try{await COL('theatre').doc(d.id).update({status:'inprogress',startAt:TS()})}catch(e){alert(why(e))}},
 tcx:async d=>{if(confirm('Cancel this surgery?'))COL('theatre').doc(d.id).update({status:'cancelled'}).catch(e=>alert(why(e)))},
 tdone:async d=>{const n=prompt('Operation notes (procedure done, findings, complications, post-operative plan):','');if(n===null)return;try{await COL('theatre').doc(d.id).update({status:'done',notes:n,endAt:TS()})}catch(e){alert(why(e))}},
 tprint:d=>{const c=st.tc.find(x=>x.id===d.id);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>OPERATION RECORD</div><hr>Patient: ${esc(c.pname)} (${esc(c.pno)})<br>Procedure: ${esc(c.procedure)} (${esc(c.type)})<br>${c.date} ${esc(c.time)} · ${esc(c.room)}<br>Surgeon: ${esc(c.surgeon)} · Anaesthetist: ${esc(c.anaes||'-')}<hr>Checklist: ${CHK.map(x=>x[1]+': '+((c.chk||{})[x[0]]?'yes':'no')).join('; ')}<hr>${esc(c.notes).split(NL).join('<br>')}</div>`)},
 gbt:d=>gbt(d.id),rfill:rfill,rsave:rsave,
 rprint:d=>{const r=st.rf.find(x=>x.id===d.id);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>${esc(brn(r.branch))} · ${esc(CFG.tel)}</div><hr>REFERRAL LETTER (${esc(r.urgency)})<br>${fdt(r.at)}<br>${r.direction==='out'?'To':'From'}: ${esc(r.facility)} ${esc(r.specialty||'')}<hr>Patient: ${esc(r.pname)} (${esc(r.pno)})<br>Reason: ${esc(r.reason)}<br><br>${esc(r.summary||'').split(NL).join('<br>')}<hr>Referring doctor: ${esc(r.doctorName)}</div>`)},
 wround:d=>roundForm(st.ad.find(x=>x.id===d.id)),rsave2:rsave2,wclose2:()=>{$('wn').innerHTML=''},
 limg:d=>viewImgs(d.id),
 radd2:radd2,rdel:async d=>{if(confirm('Remove this shift?'))COL('rosters').doc(d.id).delete().catch(e=>alert(why(e)))},
 ins_add:async()=>{const n=$('i1').value.trim(),p=+$('i2').value;if(!n||!(p>0&&p<=100))return;await COL('insurers').add({name:n,pct:p});go('setup')},ins_del:async d=>{if(confirm('Remove this insurer?')){await COL('insurers').doc(d.id).delete();go('setup')}},
 paysave:async()=>{const o={ssnit:+$('py1').value||0,ssnitEr:+$('py2').value||0,bands:$('py3').value.trim()};try{await COL('config').doc('main').set({pay:o},{merge:true});say('pym','Saved.','good')}catch(e){say('pym',why(e),'bad')}},
 spsave:async d=>{const u=ULIST.find(x=>x.id===d.id),g=k=>+$(k+'_'+d.id).value||0;try{await COL('staffpay').doc(d.id).set({uid:d.id,name:u.name,role:u.role,branch:u.branch,basic:g('pb'),allow:g('pa'),ded:g('pd')});st.sp[d.id]={basic:g('pb'),allow:g('pa'),ded:g('pd')}}catch(e){alert(why(e))}},
 prun:prun,
 prsave:async()=>{const r=st.run;try{if(Object.keys(st.runs||[]).length&&(st.runs||[]).some(x=>x.id===r.id)&&!confirm('A payroll run for this month already exists. Replace it?'))return;await COL('payruns').doc(r.id).set({...r,at:TS(),by:U.name});say('prm','Payroll run saved.','good');prList()}catch(e){say('prm',why(e),'bad')}},
 prprintnow:()=>printIt(st.run.lines.map(l=>slipHtml(st.run,l)).join('')),prprint:d=>{const r=st.runs.find(x=>x.id===d.id);printIt(r.lines.map(l=>slipHtml(r,l)).join(''))}
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t&&t.closest('nav'))return go(t.dataset.t);const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset,a)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

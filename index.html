<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital System</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b3a63">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;--b:#0b5cad;--g:#0a7d4b;--ln:#d8dde2}*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:#eef2f6;color:#14181c}
header{background:#0b3a63;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
header select{width:auto;padding:4px 8px}nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--ln);padding:6px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{width:auto;margin:0;background:#e8eef4;color:#14181c;padding:8px 14px;white-space:nowrap}nav button.on{background:var(--b);color:#fff}
main{max-width:1050px;margin:0 auto;padding:12px}.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:16px}h3{margin:12px 0 4px;font-size:14px}label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
input,select,textarea,button{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid #b8c0c8;background:#fff;color:#14181c}textarea{min-height:60px}
button{background:#14181c;color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:8px}button.g{background:var(--g)}button.b{background:var(--b)}button.r{background:#b3261e}button.s{width:auto;padding:4px 10px;margin:0}button.alt{background:#e8eef4;color:#14181c}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.row>button{margin-top:0;align-self:end}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{font-size:12px;color:#555}
.big{font-size:24px;font-weight:800}.mut{color:#666;font-size:12px}.tag{padding:1px 8px;border-radius:99px;font-size:11px;background:#e8eef4;white-space:nowrap}.bad{background:#fde3e0;color:#7a1b13}.warn{background:#fff3d6;color:#5a4300}.ok{background:#dff3e6;color:#12532d}.inf{background:#dbe9f8;color:#0b3a63}
.tw{overflow-x:auto}.hide{display:none}.msg{padding:9px;border-radius:8px;margin-top:8px;background:#fff3d6;color:#5a4300}.msg.bad{background:#fde3e0;color:#7a1b13}.msg.good{background:#dff3e6;color:#12532d}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}.bed{padding:8px;border-radius:8px;border:1px solid var(--ln);text-align:center;font-size:12px}.bed.free{background:#dff3e6}.bed.occ{background:#fde3e0}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--ln)}.chk input{width:20px;height:20px;flex:none;padding:0}
#print{display:none}.rc{font:12px/1.4 monospace;color:#000;padding:6mm;width:180mm}.rc hr{border:0;border-top:1px dashed #000}.rc .rt{display:flex;justify-content:space-between}.rc table td,.rc table th{border:0;padding:2px 4px;color:#000}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}@page{margin:0}}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="34" height="34" style="border-radius:8px"><div><b id="hn">Hospital System</b><div class="mut" id="hu" style="color:#bcd6ee"></div></div></div><div style="display:flex;gap:8px;align-items:center"><span id="net" class="tag ok">Online</span><select id="brs" class="hide"></select><button id="lo" class="s alt hide">Log out</button></div></header>
<nav id="nav" class="hide"></nav>
<main><section id="auth" class="card" style="max-width:420px;margin:30px auto"><h2 id="at">Log in</h2>
 <div id="regf" class="hide"><label>Full name</label><input id="rn"></div><label>Username</label><input id="un" autocapitalize="none"><label>Password</label><input id="pw" type="password">
 <button id="go" class="b">Log in</button><button id="sw" class="alt">Create an account</button><div id="am"></div></section><div id="v"></div></main><div id="print"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT.firebaseapp.com",projectId:"PASTE_PROJECT",appId:"PASTE_APP_ID"});
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp,INC=firebase.firestore.FieldValue.increment;
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=n=>db.collection(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),m2=x=>Math.round(x*100)/100,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const say=(el,t,c)=>{$(el).innerHTML=t?`<div class="msg ${c||''}">${t}</div>`:''};
const ROLES={admin:'Administrator',doctor:'Doctor',nurse:'Nurse',reception:'Reception',lab:'Lab and radiology',pharmacist:'Pharmacist',cashier:'Billing and cashier',pending:'Waiting for a role'};
const TABS={admin:['dash','pat','queue','lab','pharm','ward','bill','claims','setup'],doctor:['queue','pat','ward'],nurse:['queue','pat','ward'],reception:['pat','queue'],lab:['lab'],pharmacist:['pharm'],cashier:['bill','claims'],pending:[]};
const TN={dash:'Dashboard',pat:'Patients',queue:'Queue and visits',lab:'Lab and radiology',pharm:'Pharmacy',ward:'Wards',bill:'Billing',claims:'NHIS claims',setup:'Setup'};
let U=null,CFG={name:'Hospital',addr:'',tel:'',cur:'GHS'},BRS=[],br=null,SERV=[],DRUGS=[],STK={},WARDS=[],BEDS=[],DOCS=[],unsubs=[],scr=[],tab='',stU=null;
const money=x=>CFG.cur+' '+Number(x||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const fdt=t=>{const d=t&&t.toDate?t.toDate():new Date(t||Date.now());return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})};
const brn=id=>(BRS.find(b=>b.id===id)||{}).name||'',brc=id=>(BRS.find(b=>b.id===id)||{}).code||'HQ',is=(...r)=>U&&r.includes(U.role);
const why=e=>e&&e.code==='permission-denied'?'Your role is not allowed to do that.':'Error: '+((e&&(e.code||e.message))||'unknown');
addEventListener('online',net);addEventListener('offline',net);function net(){$('net').textContent=navigator.onLine?'Online':'Offline: saving on this device';$('net').className='tag '+(navigator.onLine?'ok':'warn')}
const V=h=>{$('v').innerHTML=h},err=t=>{if($('err'))$('err').textContent=t||''},printIt=h=>{$('print').innerHTML=h;setTimeout(()=>window.print(),50)};
let devId=localStorage.getItem('hms_dev');if(!devId){devId=Math.random().toString(36).slice(2,4).toUpperCase();localStorage.setItem('hms_dev',devId)}
const nextNo=p=>{const n=+(localStorage.getItem('hms_ctr')||0)+1;localStorage.setItem('hms_ctr',n);return brc(br)+'-'+devId+'-'+p+String(n).padStart(5,'0')};
const sub=(q,f)=>scr.push(q.onSnapshot(f,e=>console.log(e.code))),rows=sn=>sn.docs.map(d=>({id:d.id,...d.data()}));
const audit=(a,p)=>COL('audit').add({uid:U.uid,name:U.name,action:a,pid:p||'',branch:br,at:TS()}).catch(()=>{});
const ago=t=>t&&t.toDate?t.toDate():new Date(t||Date.now());

/* ---------- accounts ---------- */
const mail=async u=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.trim().toLowerCase()));return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('')+'@hms.local'};
let reg=false;
$('sw').onclick=()=>{reg=!reg;$('regf').classList.toggle('hide',!reg);$('at').textContent=reg?'Create account':'Log in';$('go').textContent=reg?'Create account':'Log in';$('sw').textContent=reg?'I have an account':'Create an account';say('am','')};
$('go').onclick=async()=>{const u=$('un').value,p=$('pw').value;if(!u.trim()||!p)return say('am','Enter a username and a password.','bad');
 try{const em=await mail(u),pp=p+'#hms-2026';
  if(reg){if(!$('rn').value.trim())return say('am','Enter your full name.','bad');const c=await auth.createUserWithEmailAndPassword(em,pp);
   await COL('users').doc(c.user.uid).set({name:$('rn').value.trim(),username:u.trim().toLowerCase(),role:'pending',branch:null,active:true,created:TS()})}
  else await auth.signInWithEmailAndPassword(em,pp)}
 catch(e){say('am',e.code==='auth/email-already-in-use'?'That username is taken.':'Could not continue. Check your details.','bad')}};
$('lo').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
 stop();if(!u){U=null;$('auth').classList.remove('hide');$('v').innerHTML='';$('nav').classList.add('hide');$('lo').classList.add('hide');$('brs').classList.add('hide');$('hu').textContent='';return}
 let s;for(let i=0;i<8;i++){s=await COL('users').doc(u.uid).get();if(s.exists)break;await sleep(500)}
 if(!s.exists){await auth.signOut();return say('am','Profile not found. Create the account again.','bad')}
 U={uid:u.uid,...s.data()};$('auth').classList.add('hide');$('lo').classList.remove('hide');net();begin()});
function stop(){unsubs.forEach(f=>f());unsubs=[];scr.forEach(f=>f());scr=[];if(stU){stU();stU=null}}
function begin(){
 if(!U.active||U.role==='pending'){$('hu').textContent=U.name;V(`<div class="card"><h2>${U.active?'Waiting for a role':'Account disabled'}</h2><p>${U.active?'An administrator must give your account a role and a branch. Close and reopen the app after that.':'Ask an administrator.'}</p></div>`);return}
 const L=(q,f)=>unsubs.push(q.onSnapshot(f,e=>console.log(e.code)));
 L(COL('config').doc('main'),s=>{if(s.exists)CFG={...CFG,...s.data()};$('hn').textContent=CFG.name});
 L(COL('branches'),sn=>{BRS=rows(sn);if(!br||!BRS.find(b=>b.id===br))br=(BRS.find(b=>b.id===U.branch)||BRS[0]||{}).id||null;brSel();listen()});
 L(COL('services'),sn=>{SERV=rows(sn).sort((a,b)=>a.name.localeCompare(b.name))});L(COL('drugs'),sn=>{DRUGS=rows(sn).sort((a,b)=>a.name.localeCompare(b.name))});
 L(COL('users').where('role','==','doctor'),sn=>{DOCS=rows(sn).filter(d=>d.active!==false)});
 $('nav').classList.remove('hide');tab=TABS[U.role][0];nav();go(tab)}
function brSel(){const b=$('brs');b.classList.toggle('hide',!(is('admin')&&BRS.length));b.innerHTML=BRS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(br)b.value=br;$('hu').textContent=U.name+' · '+ROLES[U.role]+(br?' · '+brn(br):'')}
$('brs').onchange=()=>{br=$('brs').value;listen();brSel();go(tab)};
function listen(){if(stU){stU();stU=null}STK={};WARDS=[];BEDS=[];if(!br)return;
 const a=COL('stock').where('branch','==',br).onSnapshot(sn=>{STK={};sn.docs.forEach(d=>{STK[d.id]=d.data()});if(tab==='pharm')vPharm()},e=>console.log(e.code)),
 b=COL('wards').where('branch','==',br).onSnapshot(sn=>{WARDS=rows(sn)},e=>console.log(e.code)),
 c=COL('beds').where('branch','==',br).onSnapshot(sn=>{BEDS=rows(sn).sort((x,y)=>(x.no||'').localeCompare(y.no||'',undefined,{numeric:true}));if(tab==='ward')vWard()},e=>console.log(e.code));
 stU=()=>{a();b();c()}}
function nav(){$('nav').innerHTML=TABS[U.role].map(t=>`<button data-t="${t}" class="${t===tab?'on':''}">${TN[t]}</button>`).join('')}
function go(t){scr.forEach(f=>f());scr=[];tab=t;st={};nav();({dash:vDash,pat:vPat,queue:vQueue,lab:vLab,pharm:vPharm,ward:vWard,bill:vBill,claims:vClaims,setup:vSetup})[t]()}
let st={};
const patLine=p=>`<b>${esc(p.name)}</b> <span class="mut">${esc(p.no)}</span>${p.nhis?' <span class="tag inf">NHIS</span>':''}`;
const age=p=>p.dob?Math.max(0,Math.floor((Date.now()-new Date(p.dob))/315576e5))+' yrs':(p.age?p.age+' yrs':'');

/* ---------- patients ---------- */
function vPat(){V(`<div class="card"><h2>Find a patient</h2><div class="row"><div><input id="ps" placeholder="Name, patient number or phone"></div><button class="b" data-a="psearch">Search</button>${is('admin','reception','nurse')?'<button class="g" data-a="pnew">Register a new patient</button>':''}</div><div id="pform"></div></div><div class="card"><div id="pl" class="tw"></div></div>`);$('ps').onkeydown=e=>{if(e.key==='Enter')A.psearch()};A.psearch()}
async function psearch(){const q=($('ps').value||'').trim(),ql=q.toLowerCase();$('pl').innerHTML='Searching…';
 try{let docs=[];if(q.length<2)docs=(await COL('patients').orderBy('at','desc').limit(20).get()).docs;else{const E=String.fromCharCode(0xf8ff),r=await Promise.all([COL('patients').where('no','==',q.toUpperCase()).get(),COL('patients').where('phone','==',q).get(),COL('patients').where('nameLower','>=',ql).where('nameLower','<=',ql+E).limit(20).get()]);const m={};r.forEach(s=>s.docs.forEach(d=>{m[d.id]=d}));docs=Object.values(m)}
  const P=docs.map(d=>({id:d.id,...d.data()}));$('pl').innerHTML='<table><tr><th>Patient</th><th>Details</th><th></th></tr>'+(P.map(p=>`<tr><td>${patLine(p)}</td><td>${esc(p.sex||'')} ${age(p)}<br><span class="mut">${esc(p.phone||'')}</span></td><td><button class="s b" data-a="pfile" data-id="${p.id}">Open</button></td></tr>`).join('')||'<tr><td colspan=3 class="mut">No patients found.</td></tr>')+'</table>'}
 catch(e){$('pl').innerHTML='<div class="msg bad">'+esc(why(e))+'</div>'}}
function pnewForm(){$('pform').innerHTML=`<h3>New patient</h3><div class="row"><div><label>Full name</label><input id="n1"></div><div><label>Sex</label><select id="n2"><option>Female</option><option>Male</option></select></div><div><label>Date of birth</label><input id="n3" type="date"></div><div><label>Or age (years)</label><input id="n4" type="number"></div><div><label>Phone</label><input id="n5" inputmode="tel"></div><div><label>NHIS number</label><input id="n6"></div><div><label>Address</label><input id="n7"></div><div><label>Next of kin</label><input id="n8"></div><div><label>Kin phone</label><input id="n9"></div><div><label>Allergies</label><input id="n10"></div></div><div id="err" style="color:#b3261e"></div><button class="g" data-a="psave">Register patient</button>`}
async function psave(){const n=$('n1').value.trim();if(!n)return err('Enter the patient name.');const g=k=>$(k).value.trim(),id=uid(),p={no:nextNo('P'),name:n,nameLower:n.toLowerCase(),sex:$('n2').value,dob:$('n3').value,age:+$('n4').value||0,phone:g('n5'),nhis:g('n6'),addr:g('n7'),kin:g('n8'),kinPhone:g('n9'),allergies:g('n10'),branch:br,createdBy:U.uid};
 try{await Promise.race([COL('patients').doc(id).set({...p,at:TS()}),sleep(4000)]);audit('register',id);vFile(id)}catch(e){err(why(e))}}
async function vFile(id){go('pat');tab='pat';V('<div class="card">Loading…</div>');audit('view',id);
 try{const [ps,vs,as,bs]=await Promise.all([COL('patients').doc(id).get(),COL('visits').where('pid','==',id).get(),COL('admissions').where('pid','==',id).get(),is('admin','cashier')?COL('bills').where('pid','==',id).get():Promise.resolve({docs:[]})]);
  const p={id,...ps.data()},VS=rows(vs).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),AD=rows(as),BL=rows(bs);st.p=p;
  V(`<div class="card"><button class="s alt" data-a="pback">Back</button><h2 style="margin-top:8px">${patLine(p)}</h2><p>${esc(p.sex||'')} · ${age(p)} · ${esc(p.phone||'-')} · ${esc(p.addr||'')}<br>NHIS: ${esc(p.nhis||'none')} · Next of kin: ${esc(p.kin||'-')} ${esc(p.kinPhone||'')}</p>${p.allergies?`<div class="msg bad">Allergies: ${esc(p.allergies)}</div>`:''}
  ${is('admin','reception','doctor','nurse')?'<h3>New visit or appointment</h3><div class="row"><div><label>Doctor</label><select id="vd"><option value="">Any available doctor</option>'+DOCS.filter(d=>!d.branch||d.branch===br).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')+'</select></div><div><label>Reason</label><input id="vr"></div><div><label>Appointment date (leave blank for today)</label><input id="vw" type="date"></div><button class="g" data-a="vnew">Create visit</button></div><div id="vm"></div>':''}</div>
  <div class="card"><h2>Visits</h2><div class="tw"><table><tr><th>Date</th><th>Doctor / reason</th><th>Diagnosis</th><th>Status</th></tr>${VS.map(v=>`<tr><td>${v.date}</td><td>${esc(v.doctorName||'-')}<br><span class="mut">${esc(v.reason||'')}</span></td><td>${esc(v.diagnosis||'')}<br><span class="mut">${esc(v.notes||'')}</span></td><td><span class="tag">${v.status}</span></td></tr>`).join('')||'<tr><td colspan=4 class="mut">No visits yet.</td></tr>'}</table></div></div>
  <div class="card"><h2>Admissions</h2><table>${AD.map(a=>`<tr><td>${fdt(a.at)}</td><td>${esc(a.wardName)} bed ${esc(a.bedNo)}</td><td><span class="tag ${a.status==='admitted'?'warn':'ok'}">${a.status}</span></td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>
  ${is('admin','cashier')?`<div class="card"><h2>Bills</h2><table>${BL.map(b=>`<tr><td>${esc(b.title||'')}<br><span class="mut">${fdt(b.at)}</span></td><td>${money(b.total)}</td><td>${money(b.paid)}</td><td><span class="tag">${b.status}</span></td></tr>`).join('')||'<tr><td class="mut">None.</td></tr>'}</table></div>`:''}`)}
 catch(e){V('<div class="card msg bad">'+esc(why(e))+'</div>')}}
async function vnew(){const p=st.p,dsel=$('vd').value,d=DOCS.find(x=>x.id===dsel),w=$('vw').value,date=w||today();
 try{await COL('visits').add({pid:p.id,pname:p.name,pno:p.no,branch:br,doctorId:dsel,doctorName:d?d.name:'',reason:$('vr').value.trim(),date,status:w&&w>today()?'booked':'waiting',at:TS()});say('vm','Visit created. It appears in the queue for '+date+'.','good')}catch(e){say('vm',why(e),'bad')}}

/* ---------- queue, triage, consultation ---------- */
const VST={booked:'inf',waiting:'warn',triaged:'warn',done:'ok',cancelled:'bad'};
function vQueue(){const d=st.qd||today();V(`<div id="work"></div><div class="card"><div class="row"><div><label>Date</label><input id="qd" type="date" value="${d}"></div></div><div class="tw"><table id="qt"></table></div></div>`);
 $('qd').onchange=()=>{st.qd=$('qd').value;go('queue');st.qd=$('qd').value};
 sub(COL('visits').where('branch','==',br).where('date','==',d),sn=>{st.vs=rows(sn).sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));qDraw()})}
function qDraw(){if(!$('qt'))return;const mine=is('doctor');$('qt').innerHTML='<tr><th>Patient</th><th>Doctor / reason</th><th>Vitals</th><th>Status</th><th></th></tr>'+(st.vs.filter(v=>!mine||!v.doctorId||v.doctorId===U.uid).map(v=>{const x=v.vitals||{};return `<tr><td>${esc(v.pname)}<br><span class="mut">${esc(v.pno)}</span></td><td>${esc(v.doctorName||'any')}<br><span class="mut">${esc(v.reason||'')}</span></td><td class="mut">${x.bp?'BP '+esc(x.bp)+' · T '+esc(x.temp)+' · P '+esc(x.pulse)+' · SpO2 '+esc(x.spo2)+' · '+esc(x.wt)+'kg':''}</td><td><span class="tag ${VST[v.status]||''}">${v.status}</span></td><td>
  ${v.status==='booked'&&is('admin','reception')?`<button class="s g" data-a="vin" data-id="${v.id}">Check in</button>`:''}
  ${['waiting','triaged'].includes(v.status)&&is('admin','nurse')?`<button class="s b" data-a="vtri" data-id="${v.id}">Triage</button>`:''}
  ${['waiting','triaged'].includes(v.status)&&is('admin','doctor')?`<button class="s g" data-a="vcon" data-id="${v.id}">Consult</button>`:''}
  ${['booked','waiting'].includes(v.status)&&is('admin','reception')?`<button class="s r" data-a="vcx" data-id="${v.id}">Cancel</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=5 class="mut">No visits for this day.</td></tr>')}
function triForm(v){$('work').innerHTML=`<div class="card"><h2>Triage: ${esc(v.pname)}</h2><div class="row"><div><label>Blood pressure</label><input id="t1" placeholder="120/80"></div><div><label>Temperature (C)</label><input id="t2" type="number" step="0.1"></div><div><label>Pulse</label><input id="t3" type="number"></div><div><label>SpO2 (%)</label><input id="t4" type="number"></div><div><label>Weight (kg)</label><input id="t5" type="number" step="0.1"></div></div><div id="err" style="color:#b3261e"></div><button class="g" data-a="tsave" data-id="${v.id}">Save vitals</button> <button class="alt" data-a="wclose">Cancel</button></div>`;scrollTo(0,0)}
function conForm(v){st.rx=[];st.cv=v;const lab=SERV.filter(s=>['lab','rad'].includes(s.type)),fw=WARDS;
 $('work').innerHTML=`<div class="card"><h2>Consultation: ${esc(v.pname)}</h2><div class="mut">${esc(v.reason||'')} ${v.vitals?'· BP '+esc(v.vitals.bp)+' T '+esc(v.vitals.temp):''}</div>
 <label>Complaints and examination</label><textarea id="c1"></textarea><label>Diagnosis</label><input id="c2" placeholder="e.g. Malaria (B50)"><label>Notes and plan</label><textarea id="c3"></textarea>

 <div class="card"><h2>Drug catalogue</h2><div class="row"><div><label>Name</label><input id="d1"></div><div><label>Form</label><input id="d2" placeholder="tablet, syrup"></div><div><label>Price</label><input id="d3" type="number" step="0.01"></div><div><label>Reorder at</label><input id="d4" type="number" value="10"></div><div><label>NHIS</label><select id="d5"><option value="1">Covered</option><option value="">Not covered</option></select></div><button class="g" data-a="dr_add">Add</button></div><div class="tw"><table>${DRUGS.map(d=>`<tr><td>${esc(d.name)} ${esc(d.form||'')}</td><td>${(d.price||0).toFixed(2)}</td><td>${d.nhis?'NHIS':''}</td><td><button class="s r" data-a="dr_del" data-id="${d.id}">Delete</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Wards and beds (${esc(brn(br))})</h2><div class="row"><div><label>Ward name</label><input id="w1"></div><div><label>Price per bed day</label><input id="w2" type="number" step="0.01"></div><div><label>Number of beds</label><input id="w3" type="number" value="6"></div><button class="g" data-a="w_add">Add ward</button></div><p class="mut">${WARDS.map(w=>esc(w.name)+' ('+BEDS.filter(b=>b.wardId===w.id).length+' beds)').join(' · ')}</p></div>
 <div class="card"><h2>Audit log</h2><div id="au" class="tw mut">Loading…</div></div><div class="card"><h2>Backup</h2><button class="g" data-a="bkdl">Download backup file</button><div id="bkm"></div></div>`);
 sub(COL('users'),sn=>{const U2=rows(sn),bo=b=>'<option value="">No branch</option>'+BRS.map(x=>`<option value="${x.id}"${b===x.id?' selected':''}>${esc(x.name)}</option>`).join('');
  $('ut').innerHTML='<table><tr><th>User</th><th>Role</th><th>Branch</th><th>Active</th></tr>'+U2.map(u=>`<tr><td>${esc(u.name)}<br><span class="mut">${esc(u.username)}</span></td><td><select data-u="${u.id}" data-f="role">${Object.keys(ROLES).map(r=>`<option value="${r}"${u.role===r?' selected':''}>${ROLES[r]}</option>`).join('')}</select></td><td><select data-u="${u.id}" data-f="branch">${bo(u.branch)}</select></td><td><input type="checkbox" data-u="${u.id}" data-f="active" ${u.active!==false?'checked':''} style="width:22px;height:22px"></td></tr>`).join('')+'</table>';
  $('ut').querySelectorAll('[data-u]').forEach(el=>{el.onchange=()=>COL('users').doc(el.dataset.u).update({[el.dataset.f]:el.dataset.f==='active'?el.checked:(el.value||null)}).catch(x=>alert(why(x)))})});
 COL('audit').orderBy('at','desc').limit(40).get().then(sn=>{$('au').innerHTML='<table>'+rows(sn).map(a=>`<tr><td>${fdt(a.at)}</td><td>${esc(a.name)}</td><td>${esc(a.action)}</td><td>${esc(a.pid)}</td></tr>`).join('')+'</table>'}).catch(()=>{})}

/* ---------- actions ---------- */
const A={
 psearch:psearch,pnew:pnewForm,psave:psave,pfile:d=>vFile(d.id),pback:()=>go('pat'),vnew:vnew,
 vin:d=>COL('visits').doc(d.id).update({status:'waiting'}).catch(e=>alert(why(e))),vcx:d=>{if(confirm('Cancel this visit?'))COL('visits').doc(d.id).update({status:'cancelled'}).catch(e=>alert(why(e)))},
 vtri:d=>triForm(st.vs.find(v=>v.id===d.id)),wclose:()=>{$('work').innerHTML=''},
 tsave:async d=>{const g=k=>$(k).value.trim();if(!g('t1')&&!g('t2'))return err('Enter at least the blood pressure or temperature.');try{await COL('visits').doc(d.id).update({vitals:{bp:g('t1'),temp:g('t2'),pulse:g('t3'),spo2:g('t4'),wt:g('t5'),by:U.name},status:'triaged'});$('work').innerHTML=''}catch(e){err(why(e))}},
 vcon:d=>conForm(st.vs.find(v=>v.id===d.id)),
 rxadd:()=>{const dr=DRUGS.find(x=>x.id===$('rd').value),q=+$('rq').value;if(!dr||!(q>0))return err('Choose a drug and a quantity.');st.rx.push({did:dr.id,name:dr.name,dose:$('rdose').value.trim(),qty:q,price:dr.price||0,nhis:!!dr.nhis});rxDraw();err('')},rxrm:d=>{st.rx.splice(d.k,1);rxDraw()},csave:csave,
 lsave:async d=>{const r=$('rs_'+d.id).value.trim();if(!r)return alert('Enter the result first.');try{await COL('orders').doc(d.id).update({status:'done',result:r,resultBy:U.name,doneAt:TS()});audit('result',st.lo.find(o=>o.id===d.id).pid)}catch(e){alert(why(e))}},
 lprint:d=>{const o=st.ld.find(x=>x.id===d.id);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>${esc(brn(o.branch))}</div><hr>${o.type==='rad'?'RADIOLOGY':'LABORATORY'} RESULT<br>Patient: ${esc(o.pname)} (${esc(o.pno)})<br>Requested by ${esc(o.by)} · Reported ${fdt(o.doneAt)} by ${esc(o.resultBy)}<hr>${o.items.map(i=>esc(i.name)).join(', ')}<hr>${esc(o.result).split('\n').join('<br>')}</div>`)},
 sadd:async()=>{const q=+$('sqty').value,id=$('sd').value;if(!id||!(q>0))return err('Choose a drug and a quantity.');const u={branch:br,did:id,qty:INC(q)};if($('sex').value)u.exp=$('sex').value;try{await COL('stock').doc(br+'_'+id).set(u,{merge:true})}catch(e){err(why(e))}},
 disp:async d=>{const o=st.pw.find(x=>x.id===d.id),b=db.batch();o.items.forEach(i=>b.update(COL('stock').doc(br+'_'+i.did),{qty:INC(-i.qty)}));b.update(COL('orders').doc(o.id),{status:'dispensed',dispensedBy:U.name,doneAt:TS()});
  try{await Promise.race([b.commit(),sleep(4000)]);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>PHARMACY</div><hr>Patient: ${esc(o.pname)} (${esc(o.pno)})<br>Prescribed by ${esc(o.by)} · ${fdt(Date.now())}<hr>${o.items.map(i=>`<b>${esc(i.name)}</b> x${i.qty}<br>${esc(i.dose)}`).join('<hr>')}<hr>Dispensed by ${esc(U.name)}</div>`)}catch(e){alert(why(e))}},
 wnote:async d=>{const t=$('nt_'+d.id).value.trim();if(!t)return;const a=st.ad.find(x=>x.id===d.id);try{await COL('admissions').doc(d.id).update({notes:[...(a.notes||[]),{at:Date.now(),by:U.name,text:t,vit:$('nv_'+d.id).value.trim()}]});audit('note',a.pid)}catch(e){alert(why(e))}},
 wdis:async d=>{const a=st.ad.find(x=>x.id===d.id),s=prompt('Discharge summary (diagnosis, treatment given, advice):','');if(s===null)return;const b=db.batch();b.update(COL('admissions').doc(a.id),{status:'discharged',summary:s,dischargedAt:TS()});b.update(COL('beds').doc(a.bedId),{status:'free',admId:null});
  try{await Promise.race([b.commit(),sleep(4000)]);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>DISCHARGE SUMMARY</div><hr>Patient: ${esc(a.pname)} (${esc(a.pno)})<br>Ward: ${esc(a.wardName)} bed ${esc(a.bedNo)}<br>Admitted ${fdt(a.at)} · Discharged ${fdt(Date.now())}<br>Doctor: ${esc(a.doctorName)}<hr>${esc(s).split('\n').join('<br>')}</div>`)}catch(e){alert(why(e))}},
 bsearch:bsearch,bpat:d=>bpat(d.id),gbv:d=>gbv(d.id),gba:d=>gba(d.id),bpay:bpay,bclaim:bclaim,
 bopen:async d=>{const s=await COL('bills').doc(d.id).get();st.bp={id:s.data().pid,name:s.data().pname,no:s.data().pno,nhis:s.data().nhisNo};bShow({id:d.id,...s.data()})},
 cprint:d=>{const c=st.cl.find(x=>x.id===d.id);printIt(`<div class="rc"><div style="text-align:center"><b>${esc(CFG.name)}</b><br>NHIS CLAIM FORM</div><hr>Patient: ${esc(c.pname)}<br>NHIS no: ${esc(c.nhisNo)}<br>Facility: ${esc(brn(c.branch))}<br>Date: ${fdt(c.at)}<br>Diagnosis: ${esc(c.diagnosis)}<hr><table style="width:100%"><tr><td>Item</td><td>Qty</td><td>Price</td><td>Total</td></tr>${c.lines.map(l=>`<tr><td>${esc(l.d)}</td><td>${l.q}</td><td>${l.p.toFixed(2)}</td><td>${(l.q*l.p).toFixed(2)}</td></tr>`).join('')}</table><hr><b>Claim total ${money(c.amount)}</b></div>`)},
 cset:async()=>{const o={};['name','addr','tel','cur'].forEach(k=>{o[k]=$('c_'+k).value.trim()});try{await COL('config').doc('main').set(o,{merge:true});say('cm','Saved.','good')}catch(e){say('cm',why(e),'bad')}},
 badd:async()=>{const n=$('bn').value.trim(),c=($('bcd').value.trim()||n.slice(0,2)).toUpperCase();if(!n)return;await COL('branches').add({name:n,code:c});go('setup')},
 sv_add:async()=>{const n=$('s1').value.trim();if(!n)return;await COL('services').add({name:n,type:$('s2').value,price:+$('s3').value||0,nhis:!!$('s4').value});go('setup')},sv_del:async d=>{if(confirm('Delete this service?')){await COL('services').doc(d.id).delete();go('setup')}},
 dr_add:async()=>{const n=$('d1').value.trim();if(!n)return;await COL('drugs').add({name:n,form:$('d2').value.trim(),price:+$('d3').value||0,re:+$('d4').value||10,nhis:!!$('d5').value});go('setup')},dr_del:async d=>{if(confirm('Delete this drug?')){await COL('drugs').doc(d.id).delete();go('setup')}},
 w_add:async()=>{const n=$('w1').value.trim(),k=Math.min(60,+$('w3').value||0);if(!n||!br)return;const wid=uid(),b=db.batch();b.set(COL('wards').doc(wid),{branch:br,name:n,rate:+$('w2').value||0});for(let i=1;i<=k;i++)b.set(COL('beds').doc(uid()),{branch:br,wardId:wid,wardName:n,no:String(i),status:'free'});await b.commit();go('setup')},
 bkdl:async()=>{say('bkm','Preparing…');try{const o={at:new Date().toISOString()};for(const c of ['config','branches','services','drugs','stock','wards','beds','patients','visits','orders','admissions','bills','payments','claims'])o[c]=rows(await COL(c).get());
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='hospital-backup-'+today()+'.json';a.click();say('bkm','Backup downloaded.','good')}catch(e){say('bkm',why(e),'bad')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t&&t.closest('nav'))return go(t.dataset.t);const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset,a)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
